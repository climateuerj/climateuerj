<meta charset="UTF-8" />

<title>Climate · Laboratório Ambiental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(0.97 0.008 110);
    --paper-2: oklch(0.94 0.012 115);
    --paper-3: oklch(0.91 0.018 120);
    --ink: oklch(0.18 0.012 150);
    --ink-2: oklch(0.36 0.014 150);
    --ink-3: oklch(0.55 0.012 150);
    --line: oklch(0.85 0.02 130);
    --line-2: oklch(0.78 0.025 130);
    --moss: oklch(0.42 0.09 155);
    --moss-deep: oklch(0.30 0.08 158);
    --lichen: oklch(0.78 0.14 130);
    --lichen-soft: oklch(0.88 0.09 128);
    --amber: oklch(0.78 0.13 75);
    --display: 'Inter Tight', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { overflow-x: hidden; }
  .mono { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .display { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }
  ::selection { background: var(--lichen); color: var(--ink); }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  /* utility */
  .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .container { padding: 0 20px; } }
</style>
</head>
